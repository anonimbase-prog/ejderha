name: iOS (imzasız IPA)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Paketleri kur
        run: npm install
      - name: Oyunu hazırla
        run: npm run prepare-web
      - name: iOS projesini oluştur
        run: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
      - name: Derle (imzasız)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 30
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr "$GITHUB_WORKSPACE/EjderhaUcusu-imzasiz.ipa" Payload
      - name: IPA dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: EjderhaUcusu-iOS
          path: EjderhaUcusu-imzasiz.ipa
